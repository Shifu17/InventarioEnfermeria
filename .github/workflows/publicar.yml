# Al subir una etiqueta de versión (por ejemplo v1.2.0) se prueba el código, se compila el .exe
# y se publica como "release" en GitHub. Los programas ya instalados lo detectan y se actualizan solos.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Verificar que la versión coincide con la etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, re
          v = re.search(r'VERSION = "([^"]+)"', open("app/version.py", encoding="utf-8").read()).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          assert v == tag, f"app/version.py dice {v} pero la etiqueta es {tag}"

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compilar .exe
        run: pyinstaller --noconfirm --clean InventarioEnfermeria.spec

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InventarioEnfermeria.exe
          generate_release_notes: false
          body_path: NOTAS_VERSION.md
